<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img"><title>From assessment evidence to action</title><rect width="960" height="280" fill="#fff"/><g font-family="Arial,sans-serif" fill="#24332f"><rect x="24" y="30" width="288" height="220" rx="6" fill="#e0eee7"/><text x="46" y="80" font-size="32">01</text><text x="46" y="136" font-size="21">Compare the pattern</text><text x="46" y="182" font-size="16">Distribution, not just a mean</text><rect x="336" y="30" width="288" height="220" rx="6" fill="#fff0ce"/><text x="358" y="80" font-size="32">02</text><text x="358" y="136" font-size="21">Check missing evidence</text><text x="358" y="182" font-size="16">Observed versus unknown</text><rect x="648" y="30" width="288" height="220" rx="6" fill="#e8edf5"/><text x="670" y="80" font-size="32">03</text><text x="670" y="136" font-size="21">Choose a response</text><text x="670" y="182" font-size="16">Target, then check again</text></g></svg>
